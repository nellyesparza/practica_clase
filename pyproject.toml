[project]
name = "proyecto-curso"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nellyesparza", email = "nesparza@utb.edu.ec" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "mcp[cli]<2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
[tool.ruff]
exclude = [".venv", "alembic/versions"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # el set básico: pyflakes + errores de pycodestyle

[tool.ruff.lint.per-file-ignores]
# E402: importa app.config después de código ejecutable, a propósito.
# F401: usuario/gasto se importan solo para que Alembic detecte sus modelos.
"alembic/env.py" = ["E402", "F401"]


